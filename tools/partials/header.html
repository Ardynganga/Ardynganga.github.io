<a class="skip-link" href="#contenu">Aller au contenu</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="logo" href="/" aria-label="{{site.brand}} — retour à l'accueil">
      <svg class="logo__mark" viewBox="0 0 135.8 94" aria-hidden="true" focusable="false"><path d="M44.4 0L82.7 0L92 17.2L73.4 47.9L63.4 33.1L59.6 39.3L61 43.2L42.6 73.4L39.6 71.8L30.4 85.7A16.4 16.4 0 0 1 2.4 68.7ZM105.4 7.8A16.4 16.4 0 0 1 133.4 25L91.6 94L53.4 94L44.5 79.2L63.4 47.8L72.4 61.7Z"/></svg>
      <span class="logo__text"><span class="logo__name">{{site.brand}}</span><span class="logo__tag">{{site.tagline}}</span></span>
    </a>
    <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Ouvrir le menu">
      <svg class="icon icon--menu" aria-hidden="true"><use href="/assets/icons.svg#menu"/></svg>
      <svg class="icon icon--close" aria-hidden="true"><use href="/assets/icons.svg#close"/></svg>
    </button>
    <nav class="site-nav" id="menu-principal" aria-label="Navigation principale">
      <ul class="site-nav__list">
        <li><a class="site-nav__link" href="/#services" data-nav="services">Services</a></li>
        <li><a class="site-nav__link" href="/#realisations" data-nav="realisations">Réalisations</a></li>
        <li><a class="site-nav__link" href="/pentest/" data-nav="pentest">Pentest</a></li>
        <li><a class="site-nav__link" href="/blog/" data-nav="blog">Blog</a></li>
        <li><a class="site-nav__link" href="/#a-propos" data-nav="a-propos">À propos</a></li>
      </ul>
      <a class="btn btn--sm site-nav__cta" href="/#contact">Me contacter</a>
      <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Passer au thème sombre">
        <svg class="icon icon--to-dark" aria-hidden="true"><use href="/assets/icons.svg#moon"/></svg>
        <svg class="icon icon--to-light" aria-hidden="true"><use href="/assets/icons.svg#sun"/></svg>
      </button>
    </nav>
  </div>
</header>
